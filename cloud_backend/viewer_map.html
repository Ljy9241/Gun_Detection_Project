<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS 轨迹地图</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px/1.5 "Microsoft YaHei",sans-serif;color:#183744;background:#f2f5f7}
body{display:flex;flex-direction:column}header{background:#123746;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:white}main{display:flex;flex:1;min-height:0;flex-direction:column;padding:14px;gap:10px}
#bar,#playbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:white;border:1px solid #cad6da;border-radius:7px;padding:9px}
button,select{padding:6px 10px;border:1px solid #b3c4ca;border-radius:5px;background:white;color:#183744;font:inherit}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}#sessions{max-width:min(420px,75vw)}
#map{flex:1;min-height:300px;border:1px solid #cad6da;border-radius:7px}#message{color:#365461;white-space:pre-wrap}
#seek{flex:1;min-width:130px}.pin{padding:3px 5px;font-size:10px;background:#2375d8;color:white;border-radius:4px;white-space:nowrap;border:1px solid white}
.start{background:#16834a}.shot{background:#c64236}.replay{background:#8256cc}.info{padding:6px;line-height:1.8;white-space:pre-line}
:focus-visible{outline:3px solid #db9d30;outline-offset:2px}
</style></head><body>
<header><strong>GPS 轨迹地图</strong><a href="/viewer/">返回记录</a></header>
<main><div id="bar"><label>上电轨迹 <select id="sessions"><option>正在加载</option></select></label>
<button id="latest">返回最新轨迹</button><label><input id="follow" type="checkbox" checked>自动跟随</label>
<button id="fit">查看完整轨迹</button><span>绿：起点　蓝：末次定位　红：射击</span></div>
<div id="map" role="img" aria-label="GPS 轨迹地图"></div>
<div id="playbar"><button id="play">播放</button><button id="reset">回到起点</button>
<label>速度 <select id="speed"><option value="1">1 倍速</option><option value="5">5 倍速</option><option value="20">20 倍速</option><option value="100">100 倍速</option></select></label>
<input id="seek" type="range" min="0" max="0" value="0" step="1" aria-label="回放进度"><span id="clock">—</span></div>
<div id="message" role="status">正在加载轨迹…</div></main>
<script>
'use strict';
const config=__AMAP_CONFIG__;
window._AMapSecurityConfig={securityJsCode:config.securityJsCode};
const $=id=>document.getElementById(id);
let map,info,track=null,points=[],lines=[],markers=[],replayMarker=null;
let selected='',selectedCount=0,autoLatest=true,playing=false,replaying=false,playMs=0,lastFrame=0,firstFit=true;
let generation=0,mapError='',mapLoaded=false;
const say=text=>{$('message').textContent=text;};
const sessionKey=s=>JSON.stringify([s.device,s.epoch,s.boot]);
window.addEventListener('error',event=>say('地图页面错误：'+event.message));

// Device coordinates are WGS-84; AMap displays GCJ-02 within mainland China.
function gcj(lon,lat){
  if(lon<72.004||lon>137.8347||lat<0.8293||lat>55.8271)return [lon,lat];
  const pi=Math.PI,x=lon-105,y=lat-35;
  let dlat=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
  dlat+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;
  dlat+=(20*Math.sin(y*pi)+40*Math.sin(y*pi/3))*2/3;
  dlat+=(160*Math.sin(y*pi/12)+320*Math.sin(y*pi/30))*2/3;
  let dlon=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
  dlon+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;
  dlon+=(20*Math.sin(x*pi)+40*Math.sin(x*pi/3))*2/3;
  dlon+=(150*Math.sin(x*pi/12)+300*Math.sin(x*pi/30))*2/3;
  const rad=lat*pi/180,magic=1-.00669342162296594323*Math.sin(rad)**2,sqrt=Math.sqrt(magic);
  return [lon+dlon*180/(6378245/sqrt*Math.cos(rad)*pi),
          lat+dlat*180/((6378245*(1-.00669342162296594323))/(magic*sqrt)*pi)];
}
function displayPoint(p){return {...p,xy:p.valid?gcj(p.lon,p.lat):null};}
function popup(p,title){
  const node=document.createElement('div');node.className='info';
  node.textContent=title+'\n'+p.time+'\n上电计时 '+(p.ms/1000).toFixed(1)+' 秒\nGPS '+p.lat.toFixed(7)+', '+p.lon.toFixed(7);
  info.setContent(node);info.open(map,p.xy);
}
function pin(p,label,style){
  const node=document.createElement('div');node.className='pin '+style;node.textContent=label;
  const marker=new AMap.Marker({position:p.xy,content:node,anchor:'bottom-center',map});
  marker.on('click',()=>popup(p,label));markers.push(marker);
}
function stop(){playing=false;$('play').textContent='播放';}
function clearTrack(){
  stop();replaying=false;
  if(map){map.remove([...lines,...markers]);if(replayMarker)map.remove(replayMarker);if(info)info.close();}
  lines=[];markers=[];replayMarker=null;points=[];track=null;
  $('seek').max=0;$('seek').value=0;$('clock').textContent='—';
}
function fit(){if(map&&[...lines,...markers].length)map.setFitView([...lines,...markers],false,[45,45,45,45],17);}
function summary(){
  if(!track)return;
  const located=track.shots.filter(p=>p.valid).length;
  say((mapError?mapError+'\n':'')+`${track.raw_count} 个有效定位点 · ${points.length} 个显示点 · ${located} 个射击位置`+
      (track.shots.length>located?` · ${track.shots.length-located} 次射击无有效定位`:'')+
      ` · 显示采样间隔约 ${(track.bucket_ms/1000).toFixed(1)} 秒（原始记录完整保存） · 点击轨迹或标记查看时间`);
}
function draw(data){
  clearTrack();track=data;points=data.points.map(displayPoint).filter(p=>p.valid);
  if(!map){summary();return;}
  if(points.length>1){
    const line=new AMap.Polyline({path:points.map(p=>p.xy),strokeColor:'#2375d8',strokeWeight:5,map});
    line.on('click',event=>{
      const click=map.lngLatToContainer(event.lnglat);
      let nearest=points[0],distance=Infinity;
      for(const p of points){const screen=map.lngLatToContainer(p.xy);
        const d=(screen.x-click.x)**2+(screen.y-click.y)**2;
        if(d<distance){distance=d;nearest=p;}}
      popup(nearest,'轨迹采样');
    });lines.push(line);
  }
  pin(points[0],'起点','start');pin(points[points.length-1],'末次定位','');
  for(const raw of data.shots){const p=displayPoint(raw);if(p.valid)pin(p,'射击 '+p.shot,'shot');}
  $('seek').max=Math.max(0,points[points.length-1].ms-points[0].ms);
  playMs=points[0].ms;$('seek').value=0;$('clock').textContent=points[points.length-1].time;
  $('play').disabled=points.length<2;$('reset').disabled=!points.length;
  if(firstFit){fit();firstFit=false;}else if($('follow').checked)map.setCenter(points[points.length-1].xy);
  summary();
}
function showPlayback(){
  if(!points.length||!map)return;
  replaying=true;
  let lo=0,hi=points.length-1;
  while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(points[mid].ms<=playMs)lo=mid;else hi=mid-1;}
  const p=points[lo];
  if(!replayMarker){
    const node=document.createElement('div');node.className='pin replay';node.textContent='回放';
    replayMarker=new AMap.Marker({position:p.xy,content:node,anchor:'bottom-center',zIndex:200,map});
    replayMarker.on('click',()=>{const current=replayMarker.getExtData();if(current)popup(current,'回放位置');});
  }
  replayMarker.setPosition(p.xy);replayMarker.setExtData(p);
  $('seek').value=playMs-points[0].ms;$('clock').textContent=p.time;
  if($('follow').checked)map.setCenter(p.xy);
}
function animate(now){
  if(playing&&points.length){
    playMs+=Math.min(now-lastFrame,1000)*Number($('speed').value);
    const end=points[points.length-1].ms;
    if(playMs>=end){playMs=end;stop();}showPlayback();
  }
  lastFrame=now;requestAnimationFrame(animate);
}
async function loadTrack(){
  if(!selected)return;
  const mine=++generation,[device,epoch,boot]=JSON.parse(selected);
  try{
    const url='/viewer/map/track?'+new URLSearchParams({device,epoch,boot});
    const response=await fetch(url,{credentials:'same-origin'});
    const data=await response.json();
    if(mine!==generation)return;
    if(!response.ok){say(data.error||'轨迹读取失败');return;}
    firstFit=true;draw(data);
  }catch(e){if(mine===generation)say('轨迹读取失败，请稍后重试。');}
}
async function refresh(){
  try{
    const response=await fetch('/viewer/map/sessions',{credentials:'same-origin'});
    const data=await response.json();
    if(!response.ok){say(data.error||'轨迹列表读取失败');return;}
    const items=data.items;
    $('sessions').textContent='';
    for(const item of items){const option=document.createElement('option');option.value=sessionKey(item);option.textContent=item.label;$('sessions').appendChild(option);}
    if(!items.length){selected='';selectedCount=0;clearTrack();say('暂无有效轨迹：同一次上电需要至少 3 个有效 GPS 定位点。');return;}
    const target=autoLatest||!items.some(item=>sessionKey(item)===selected)?sessionKey(items[0]):selected;
    $('sessions').value=target;
    const count=items.find(item=>sessionKey(item)===target).count;
    if(target!==selected||(!playing&&!replaying&&count!==selectedCount)){
      selected=target;selectedCount=count;loadTrack();
    }
  }catch(e){say('轨迹列表读取失败，请稍后重试。');}
}
function startMap(){
  try{
    map=new AMap.Map('map',{zoom:14,viewMode:'2D',center:[116.397428,39.90923]});
    info=new AMap.InfoWindow({offset:new AMap.Pixel(0,-25)});
    map.on('dragstart',()=>{$('follow').checked=false;});
    map.on('complete',()=>{mapLoaded=true;mapError='';if(track)summary();});
    if(track)draw(track);
  }catch(e){mapError='高德地图初始化失败，请检查网络或地图授权。';say(mapError);}
}
$('sessions').onchange=()=>{autoLatest=false;selected=$('sessions').value;selectedCount=0;clearTrack();loadTrack();};
$('latest').onclick=()=>{autoLatest=true;selected='';selectedCount=0;refresh();};
$('follow').onchange=()=>{if($('follow').checked&&map&&points.length){if(replaying)showPlayback();else map.setCenter(points[points.length-1].xy);}};
$('fit').onclick=fit;
$('play').onclick=()=>{if(points.length<2)return;if(playing){stop();return;}if(playMs>=points[points.length-1].ms)playMs=points[0].ms;playing=true;replaying=true;$('play').textContent='暂停';lastFrame=performance.now();};
$('reset').onclick=()=>{stop();if(points.length){playMs=points[0].ms;showPlayback();}};
$('seek').oninput=()=>{stop();if(points.length){playMs=points[0].ms+Number($('seek').value);showPlayback();}};
const script=document.createElement('script');
script.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(config.key);
script.onload=startMap;
script.onerror=()=>{mapError='高德地图加载失败，请检查网络或地图授权。';say(mapError);};
document.head.appendChild(script);
setTimeout(()=>{if(!mapLoaded){mapError='高德底图尚未就绪，请检查网络、密钥类型和域名白名单。';say(mapError);}},20000);
refresh();setInterval(()=>{if(!document.hidden)refresh();},30000);
requestAnimationFrame(animate);
</script></body></html>
